<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyra — Menu Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0b0c;
    --surface: #131316;
    --surface-2: #17171b;
    --border: #232328;
    --border-soft: #1c1c20;
    --text: #e9e8e4;
    --text-dim: #9a998f;
    --text-faint: #5f5e58;
    --gold: #c99a4a;
    --gold-dim: #8a6d3a;
    --green: #5fae72;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background: #050506;
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height: 100vh;
    padding: 30px 0;
  }

  /* Phone frame just for demo context */
  .phone{
    width: 380px;
    height: 760px;
    background: var(--bg);
    border-radius: 28px;
    border: 1px solid #222;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-mark{
    width:26px; height:26px; border-radius:6px;
    background: var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color: var(--gold); font-size:13px;
  }
  .brand-name{ font-weight:600; font-size:15px; letter-spacing:-0.01em; }

  .hamburger{
    width:32px; height:32px; border-radius:6px;
    background: var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); cursor:pointer;
    position: relative;
  }
  .hamburger svg{ transition: opacity 0.15s ease; }
  .hamburger .icon-close{ position:absolute; opacity:0; }
  .hamburger.open .icon-menu{ opacity:0; }
  .hamburger.open .icon-close{ opacity:1; }

  /* Page content behind */
  main{ padding: 14px 16px; }
  .search-box{
    position:relative;
    border:1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    margin-bottom: 12px;
  }
  .search-box svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color: var(--text-faint); }
  .search-box input{
    width:100%; background: transparent; border:none; outline:none;
    color: var(--text); font-family: var(--mono); font-size: 12px;
    padding: 11px 12px 11px 34px;
  }
  .search-box input::placeholder{ color: var(--text-faint); }
  .skeleton-row{
    height: 46px; border-radius: 6px;
    background: var(--surface);
    margin-bottom: 8px;
  }

  /* ===== Drawer ===== */
  .scrim{
    position:absolute; inset:0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }
  .scrim.visible{ opacity:1; pointer-events:auto; }

  .drawer{
    position:absolute;
    top:0; right:0; bottom:0;
    width: 78%;
    max-width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(.32,.72,0,1);
    z-index: 11;
    display:flex; flex-direction:column;
    padding: 16px;
  }
  .drawer.open{ transform: translateX(0); }

  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .drawer-title{
    font-family: var(--mono); font-size: 10.5px; letter-spacing:0.08em;
    color: var(--text-faint);
  }
  .drawer-close{
    width:26px; height:26px; border-radius:5px;
    background: var(--bg); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); cursor:pointer;
  }

  .drawer-item{
    display:flex; align-items:center; gap:11px;
    padding: 12px 10px;
    border-radius: 7px;
    cursor:pointer;
    opacity: 0;
    transform: translateX(10px);
    transition: background 0.15s ease;
  }
  .drawer.open .drawer-item{
    animation: itemIn 0.32s ease forwards;
  }
  .drawer.open .drawer-item:nth-child(1){ animation-delay: 0.06s; }
  .drawer.open .drawer-item:nth-child(2){ animation-delay: 0.11s; }
  .drawer.open .drawer-item:nth-child(3){ animation-delay: 0.16s; }
  .drawer.open .drawer-item:nth-child(4){ animation-delay: 0.21s; }
  .drawer.open .drawer-item:nth-child(5){ animation-delay: 0.26s; }
  @keyframes itemIn{
    to{ opacity:1; transform: translateX(0); }
  }
  .drawer-item:hover{ background: var(--surface-2); }
  .drawer-item .ic{
    width:30px; height:30px; border-radius:6px;
    background: var(--bg); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim); flex-shrink:0;
  }
  .drawer-item.accent .ic{ color: var(--gold); border-color: rgba(201,154,74,0.3); background: rgba(201,154,74,0.08); }
  .drawer-item .txt{ flex:1; min-width:0; }
  .drawer-item .txt .main{ font-size: 13.5px; color: var(--text); font-weight:500; }
  .drawer-item .txt .sub{ font-size: 11px; color: var(--text-faint); margin-top:1px; }
  .drawer-item .tag{
    font-family: var(--mono); font-size: 9px; letter-spacing:0.04em;
    color: var(--text-faint);
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 6px;
  }

  .drawer-divider{
    height:1px; background: var(--border-soft); margin: 8px 0;
  }

  .drawer-footer{
    margin-top: auto;
    padding-top: 12px;
    font-family: var(--mono); font-size: 10px; color: var(--text-faint);
    text-align:center;
  }
</style>
</head>
<body>

<div class="phone">
  <header>
    <div class="brand">
      <div class="brand-mark">♪</div>
      <span class="brand-name">Lyra</span>
    </div>
    <div class="hamburger" id="hamburgerBtn">
      <svg class="icon-menu" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="icon-close" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
  </header>

  <main>
    <div class="search-box">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" placeholder="Buscar por título, artista ou trecho..." />
    </div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
    <div class="skeleton-row"></div>
  </main>

  <div class="scrim" id="scrim"></div>

  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <span class="drawer-title">MENU</span>
      <div class="drawer-close" id="drawerClose">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
    </div>

    <div class="drawer-item accent">
      <div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
      <div class="txt">
        <div class="main">Login</div>
        <div class="sub">Entrar como administrador</div>
      </div>
    </div>

    <div class="drawer-item">
      <div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></div>
      <div class="txt">
        <div class="main">Tema</div>
        <div class="sub">Escuro</div>
      </div>
    </div>

    <div class="drawer-item">
      <div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg></div>
      <div class="txt">
        <div class="main">Baixar banco</div>
        <div class="sub">Exportar músicas offline</div>
      </div>
      <div class="tag">EM BREVE</div>
    </div>

    <div class="drawer-divider"></div>

    <div class="drawer-item">
      <div class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></div>
      <div class="txt">
        <div class="main">Sobre o Lyra</div>
        <div class="sub">Versão e informações</div>
      </div>
    </div>

    <div class="drawer-footer">lyra.music.db — v1</div>
  </div>
</div>

<script>
  const btn = document.getElementById('hamburgerBtn');
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  const closeBtn = document.getElementById('drawerClose');

  function openDrawer(){
    drawer.classList.add('open');
    scrim.classList.add('visible');
    btn.classList.add('open');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    scrim.classList.remove('visible');
    btn.classList.remove('open');
  }

  btn.addEventListener('click', () => {
    if(drawer.classList.contains('open')) closeDrawer();
    else openDrawer();
  });
  scrim.addEventListener('click', closeDrawer);
  closeBtn.addEventListener('click', closeDrawer);
</script>

</body>
</html>
